server:
  port: 8080

spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:mysql://localhost:3306/alleviare_admin?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  cloud:
    gateway:
      routes:
        - id: admin-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/**

jwt:
  secret: change-this-secret-to-a-strong-long-value-that-is-at-least-32-characters
  expiration-ms: 86400000
