<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alleviare SFA Platform</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:system-ui,sans-serif;background:#0f172a;color:#f1f5f9;display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .card{text-align:center;padding:48px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:20px;max-width:480px;}
    h1{font-size:28px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,#8b5cf6,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    p{color:#64748b;margin-bottom:28px;font-size:14px;}
    .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    a{padding:10px 22px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:600;transition:opacity .2s;}
    .primary{background:linear-gradient(135deg,#8b5cf6,#0ea5e9);color:#fff;}
    .secondary{background:rgba(255,255,255,0.08);color:#94a3b8;border:1px solid rgba(255,255,255,0.12);}
    a:hover{opacity:0.85;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Alleviare SFA Platform</h1>
    <p>Pharma Field Force Automation &amp; Multi-Tenant SaaS</p>
    <div class="links">
      <a class="primary" href="https://happy-sea-0ee625c00.3.azurestaticapps.net/" target="_blank" rel="noreferrer">Super Admin Portal</a>
      <a class="secondary" href="https://happy-hill-0e8076300.1.azurestaticapps.net/" target="_blank" rel="noreferrer">Staff Web App</a>
    </div>
  </div>
</body>
</html>
