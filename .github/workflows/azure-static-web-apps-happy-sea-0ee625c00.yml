name: Azure Static Web Apps Super Admin CI/CD (happy-sea-0ee625c00)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/superadmin/**'
      - '.github/workflows/azure-static-web-apps-happy-sea-0ee625c00.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'frontend/superadmin/**'
      - '.github/workflows/azure-static-web-apps-happy-sea-0ee625c00.yml'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Super Admin Console
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Verify Azure Deployment Token
        run: |
          TOKEN="${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_SEA_0EE625C00 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SUPERADMIN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Azure Static Web App API Token secret is missing in GitHub Repository Secrets!"
            exit 1
          fi

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_SEA_0EE625C00 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SUPERADMIN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/superadmin"
          api_location: ""
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_SEA_0EE625C00 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SUPERADMIN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
