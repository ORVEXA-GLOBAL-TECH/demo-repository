name: Deploy Super Admin Web Portal

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/web/super-admin/**'
      - '.github/workflows/deploy-superadmin-web.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_superadmin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/web/super-admin/package-lock.json'

      - name: Install Dependencies
        working-directory: frontend/web/super-admin
        run: npm ci

      - name: Build Next.js Application
        working-directory: frontend/web/super-admin
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build
