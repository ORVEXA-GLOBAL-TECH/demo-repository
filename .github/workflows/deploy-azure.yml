name: Build, test and deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure, no stored passwords
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  PREFIX: ${{ vars.AZURE_PREFIX }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: API tests (embedded PostgreSQL)
        run: mvn -B -ntp test
        working-directory: services/api
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Web type-check
        run: npm install --no-audit --no-fund && npx tsc --noEmit
        working-directory: apps/web
      - name: Mobile type-check
        run: npm install --no-audit --no-fund && npx tsc --noEmit
        working-directory: apps/mobile

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision / update infrastructure
        id: infra
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/azure/main.bicep \
            --parameters prefix="$PREFIX" imageTag="${{ github.sha }}" \
                         jwtSecret="${{ secrets.JWT_SECRET }}" \
                         databaseUrl="${{ secrets.DATABASE_URL }}" \
                         databasePassword="${{ secrets.DATABASE_PASSWORD }}" \
                         webOrigin="${{ vars.WEB_ORIGIN }}" \
                         webOnlyRoles="${{ vars.WEB_ONLY_ROLES }}" \
                         bootstrapCompanyCode="${{ vars.BOOTSTRAP_COMPANY_CODE }}" \
                         bootstrapCompanyName="${{ vars.BOOTSTRAP_COMPANY_NAME }}" \
                         bootstrapCurrency="${{ vars.BOOTSTRAP_CURRENCY || 'USD' }}" \
                         bootstrapTimezone="${{ vars.BOOTSTRAP_TIMEZONE || 'UTC' }}" \
                         bootstrapAdminEmail="${{ vars.BOOTSTRAP_ADMIN_EMAIL }}" \
                         bootstrapAdminPassword="${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}" \
            --query "properties.outputs" -o json > outputs.json
          echo "acr=$(jq -r .acrName.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "api=$(jq -r .apiUrl.value outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        run: az acr build -r "${{ steps.infra.outputs.acr }}" -t alleviare-api:${{ github.sha }} services/api

      - name: Build and push web image
        run: |
          az acr build -r "${{ steps.infra.outputs.acr }}" -t alleviare-web:${{ github.sha }} \
            -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL="${{ steps.infra.outputs.api }}" .

      - name: Roll out new revisions
        run: |
          ACR=$(az acr show -n "${{ steps.infra.outputs.acr }}" --query loginServer -o tsv)
          az containerapp update -g "$RESOURCE_GROUP" -n "$PREFIX-api" --image "$ACR/alleviare-api:${{ github.sha }}"
          az containerapp update -g "$RESOURCE_GROUP" -n "$PREFIX-web" --image "$ACR/alleviare-web:${{ github.sha }}"

      - name: Smoke test
        run: curl --fail --retry 10 --retry-delay 10 "${{ steps.infra.outputs.api }}/actuator/health"
