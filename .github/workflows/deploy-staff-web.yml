name: Deploy Staff Web Portals

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/web/director/**'
      - 'frontend/web/admin/**'
      - 'frontend/web/accounts/**'
      - 'frontend/web/manager/**'
      - 'frontend/web/sales-manager/**'
      - 'frontend/web/sales-supervisor/**'
      - '.github/workflows/deploy-staff-web.yml'
  workflow_dispatch:

jobs:
  build_staff_portals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Director Portal
        working-directory: frontend/web/director
        run: |
          npm install
          npm run build

      - name: Build Accounts Portal
        working-directory: frontend/web/accounts
        run: |
          npm install
          npm run build
