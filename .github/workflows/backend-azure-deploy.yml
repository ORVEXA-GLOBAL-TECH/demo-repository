name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-azure-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd backend
          npm install --production

      - name: Zip Backend Artifact
        run: |
          zip -r release.zip . -x ".git/*" "frontend/*" ".github/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'alleviare-sfa-api-2026'
          package: 'release.zip'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
