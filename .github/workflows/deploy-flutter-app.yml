name: Build & Auto-Deploy Flutter Pharma App

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/mobile/mr_app/**'
      - '.github/workflows/deploy-flutter-app.yml'
  workflow_dispatch:

jobs:
  build_flutter:
    name: Build Flutter Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: frontend/mobile/mr_app
        run: flutter pub get

      - name: Verify Code Quality
        working-directory: frontend/mobile/mr_app
        run: flutter analyze

      # 1. Build Web App (Runs in any browser on desktop/mobile)
      - name: Build Flutter Web
        working-directory: frontend/mobile/mr_app
        run: flutter build web --release --base-href "/"

      # 2. Build Android APK for phones
      - name: Build Android APK
        working-directory: frontend/mobile/mr_app
        run: flutter build apk --release

      # 3. Upload Android APK Artifact for 1-Click Download
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: alleviare-mr-app-release.apk
          path: frontend/mobile/mr_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 4. Upload Flutter Web Build Artifact
      - name: Upload Flutter Web Build
        uses: actions/upload-artifact@v4
        with:
          name: alleviare-mr-web-build
          path: frontend/mobile/mr_app/build/web
          retention-days: 30
