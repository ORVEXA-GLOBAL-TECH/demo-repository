name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Web Portal
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Application
        run: |
          cd frontend/web
          npm install
          npm run build
          cp staticwebapp.config.json dist/ 2>/dev/null || true

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_HILL_0E8076300 }}
        run: |
          npx --yes @azure/static-web-apps-cli deploy ./frontend/web/dist --env production --no-use-keychain

