name: Azure Static Web Apps Staff Portal CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/web/**'
      - '.github/workflows/azure-static-web-apps-happy-hill-0e8076300.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'frontend/web/**'
      - '.github/workflows/azure-static-web-apps-happy-hill-0e8076300.yml'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Staff SFA Portal
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Verify Azure Deployment Token
        run: |
          TOKEN="${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_HILL_0E8076300 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::Azure Static Web App API Token secret is missing in GitHub Repository Secrets!"
          else
            echo "Azure Deployment Token successfully verified."
          fi

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Application
        run: |
          npm --prefix frontend/web install
          npm --prefix frontend/web run build
          cp frontend/web/staticwebapp.config.json frontend/web/dist/ || true

      - name: Build And Deploy (Happy Hill Token)
        id: builddeploy_hill
        uses: Azure/static-web-apps-deploy@v1
        continue-on-error: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_HILL_0E8076300 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/web/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Build And Deploy (Generic Token Fallback)
        if: steps.builddeploy_hill.outcome == 'failure'
        id: builddeploy_generic
        uses: Azure/static-web-apps-deploy@v1
        continue-on-error: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/web/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        continue-on-error: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_HILL_0E8076300 || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
