spring:
  application:
    name: alleviare-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}            # required, at least 32 bytes (openssl rand -base64 48)
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}   # comma-separated browser origins; empty = none
  auth:
    web-only-roles: ${WEB_ONLY_ROLES:}          # e.g. SUPER_ADMIN; empty = every role may use the mobile app
    min-password-length: ${MIN_PASSWORD_LENGTH:10}
  expense:
    default-daily-allowance: ${EXPENSE_DEFAULT_DAILY_ALLOWANCE:0}
    default-rate-per-km: ${EXPENSE_DEFAULT_RATE_PER_KM:0}
  leave:
    defaults:
      CL: { name: Casual Leave, days: 12 }
      SL: { name: Sick Leave, days: 10 }
      PL: { name: Earned Leave, days: 15 }
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    company-code: ${BOOTSTRAP_COMPANY_CODE:}
    company-name: ${BOOTSTRAP_COMPANY_NAME:}
    currency: ${BOOTSTRAP_CURRENCY:USD}
    timezone: ${BOOTSTRAP_TIMEZONE:UTC}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
    admin-last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:User}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  dev-seed:
    enabled: ${DEV_SEED_ENABLED:false}          # development only
    password: ${DEV_SEED_PASSWORD:}
    users: ${DEV_SEED_USERS:}                   # "email:ROLE,email:ROLE"

management:
  endpoints:
    web:
      exposure:
        include: health,info
