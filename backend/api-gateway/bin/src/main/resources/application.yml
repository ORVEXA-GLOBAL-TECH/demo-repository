server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # 1. User & Hierarchy Service
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**, /api/v1/territories/**

        # 2. Master Catalog Service
        - id: master-catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/doctors/**, /api/v1/products/**, /api/v1/customers/**

        # 3. DCR & Field Visit Service
        - id: dcr-visit-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/visits/**, /api/v1/dcrs/**, /api/v1/edetailing/**, /ws/**

        # 4. POB Order Service
        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/orders/**

        # 5. Expense & Reimbursement Service
        - id: expense-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/expenses/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
