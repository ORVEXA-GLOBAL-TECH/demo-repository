version: '3.8'

services:
  # 1. PostgreSQL with PostGIS extension for Spatial Geofencing & Doctor location queries
  postgres:
    image: postgis/postgis:16-3.4
    container_name: alleviare-postgres
    environment:
      POSTGRES_USER: alleviare_admin
      POSTGRES_PASSWORD: AlleviarePassword123!
      POSTGRES_MULTIPLE_DATABASES: user_db,master_db,dcr_db,geo_db,order_db,expense_db,attendance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - alleviare-network

  # 2. Redis for Fast Session Caching, Rate Limiting & Live GPS stream
  redis:
    image: redis:7-alpine
    container_name: alleviare-redis
    ports:
      - "6379:6379"
    networks:
      - alleviare-network

  # 3. Keycloak IAM for OIDC / OAuth2, MFA, and Centralized RBAC
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: alleviare-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - alleviare-network

  # 4. MinIO (S3-Compatible Object Storage for Field Receipts & Product Brochures)
  minio:
    image: minio/minio:latest
    container_name: alleviare-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - alleviare-network

volumes:
  postgres_data:
  minio_data:

networks:
  alleviare-network:
    driver: bridge
