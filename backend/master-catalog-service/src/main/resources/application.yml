server:
  port: 8082

spring:
  application:
    name: master-catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/master_db}
    username: ${SPRING_DATASOURCE_USERNAME:alleviare_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:AlleviarePassword123!}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
